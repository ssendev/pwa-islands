<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space/Digital Sky Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A00E0"/>
      <stop offset="100%" stop-color="#8E2DE2"/>
    </linearGradient>

    <!-- Glowing Tech Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAD961"/>
      <stop offset="100%" stop-color="#F76B1C"/>
    </linearGradient>

    <!-- Golden Digital Sand Gradient -->
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>

    <!-- Palm Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>

    <!-- Vibrant Palm Leaves Gradients -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E177"/>
      <stop offset="100%" stop-color="#00B4DB"/>
    </linearGradient>

    <!-- Glossy App Overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for 3D UI Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Lighter Shadow for Canopy -->
    <filter id="canopyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Vaporwave/Digital Sun Mask (The PWA / Tech element) -->
    <mask id="sunMask">
      <rect width="512" height="512" fill="white" />
      <rect x="0" y="270" width="512" height="4" fill="black" />
      <rect x="0" y="284" width="512" height="6" fill="black" />
      <rect x="0" y="300" width="512" height="8" fill="black" />
      <rect x="0" y="318" width="512" height="10" fill="black" />
      <rect x="0" y="338" width="512" height="14" fill="black" />
    </mask>

    <!-- App Icon Base Clip Path -->
    <clipPath id="appClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Base Application Shape -->
  <g clip-path="url(#appClip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Digital Sun -->
    <circle cx="256" cy="240" r="110" fill="url(#sunGrad)" mask="url(#sunMask)" filter="url(#shadow)"/>

    <!-- Island Base -->
    <ellipse cx="256" cy="420" rx="190" ry="65" fill="url(#islandGrad)" filter="url(#shadow)"/>

    <!-- Palm Tree Trunk -->
    <path d="M 230 430 Q 240 330 320 250 Q 280 320 260 430 Z" fill="url(#trunkGrad)" filter="url(#shadow)"/>

    <!-- Coconuts (Nodes) -->
    <circle cx="305" cy="255" r="12" fill="#3E2723" filter="url(#canopyShadow)"/>
    <circle cx="325" cy="265" r="10" fill="#2D1916" filter="url(#canopyShadow)"/>
    <circle cx="295" cy="270" r="9"  fill="#2D1916" filter="url(#canopyShadow)"/>

    <!-- Palm Tree Canopy -->
    <g filter="url(#canopyShadow)">
      <!-- Top Left Frond -->
      <path d="M 320 250 Q 280 180 230 150 Q 260 220 320 250 Z" fill="url(#leafGrad2)"/>
      <!-- Far Left Frond -->
      <path d="M 320 250 Q 240 190 170 240 Q 240 260 320 250 Z" fill="url(#leafGrad1)"/>
      <!-- Bottom Left Frond -->
      <path d="M 320 250 Q 260 310 210 330 Q 260 280 320 250 Z" fill="url(#leafGrad2)"/>
      <!-- Top Right Frond -->
      <path d="M 320 250 Q 360 170 400 130 Q 350 210 320 250 Z" fill="url(#leafGrad1)"/>
      <!-- Far Right Frond -->
      <path d="M 320 250 Q 400 190 470 230 Q 400 260 320 250 Z" fill="url(#leafGrad2)"/>
      <!-- Bottom Right Frond -->
      <path d="M 320 250 Q 390 290 420 340 Q 350 310 320 250 Z" fill="url(#leafGrad1)"/>
    </g>

    <!-- Digital Ocean Waves Overlapping the Island -->
    <path d="M -20 450 Q 128 410 256 450 T 532 450 L 532 532 L -20 532 Z" fill="#00E5FF" opacity="0.25"/>
    <path d="M -20 470 Q 128 440 256 470 T 532 470 L 532 532 L -20 532 Z" fill="#2979FF" opacity="0.4"/>
  </g>

  <!-- App Icon Inner Border & Glassy Gloss Overlay -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#gloss)" opacity="0.4" pointer-events="none"/>
  <rect width="512" height="512" rx="115" ry="115" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.25" pointer-events="none"/>
</svg>
