name: Build Tauri Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            COUNT="$(git rev-list --count HEAD)"
            VERSION="0.1.${COUNT}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            arch: x64
            target: ""
            bundles: "deb:deb rpm:rpm appimage:AppImage"
          - platform: windows-latest
            name: windows-x64
            arch: x64
            target: ""
            bundles: "nsis:exe msi:msi"
          - platform: macos-latest
            name: macos-arm64
            arch: arm64
            target: aarch64-apple-darwin
            bundles: "dmg:dmg"
          - platform: macos-latest
            name: macos-x64
            arch: x64
            target: x86_64-apple-darwin
            bundles: "dmg:dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-files
          for entry in ${{ matrix.bundles }}; do
            bundle="${entry%%:*}"
            ext="${entry##*:}"
            pkg="pwa-islands.${{ matrix.arch }}.${ext}"
            echo "==> Building ${pkg} (bundle=${bundle})"
            if [ -n "${{ matrix.target }}" ]; then
              VITE_INSTALL_PACKAGE="${pkg}" npm run tauri -- build --ci --target "${{ matrix.target }}" --bundles "${bundle}"
            else
              VITE_INSTALL_PACKAGE="${pkg}" npm run tauri -- build --ci --bundles "${bundle}"
            fi
            found="$(find src-tauri/target -path "*/release/bundle/*" -type f -name "*.${ext}" | head -n 1)"
            cp -v "$found" "release-files/${pkg}"
          done
        shell: bash

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: release-files/*

  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Configure Android signing (if secrets provided)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p src-tauri/gen/android
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.keystore
            chmod 600 src-tauri/gen/android/release.keystore
            cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_STORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-pwa-islands}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_STORE_PASSWORD}
          EOF
            chmod 600 src-tauri/gen/android/keystore.properties
          fi

      - name: Build Android APK
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_INSTALL_PACKAGE: pwa-islands.universal.apk
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${NDK_HOME:-}}"
          npm run build:android

      - name: Collect Android APK
        run: |
          mkdir -p release-files
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
          cp -v "$APK" "release-files/pwa-islands.universal.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-files/*

  release:
    needs: [prepare, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PWA Islands ${{ needs.prepare.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
